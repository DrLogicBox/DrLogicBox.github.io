<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>个人介绍</title>
  <style>
    :root {
      color-scheme: light;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #f6f8ff, #e9f7ff);
      color: #1f2937;
      padding: 24px;
    }

    .card {
      width: min(720px, 100%);
      background: #ffffff;
      border-radius: 18px;
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.12);
      padding: 32px;
      line-height: 1.8;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(28px, 4vw, 36px);
    }

    .role {
      margin: 0 0 20px;
      color: #2563eb;
      font-weight: 600;
    }

    p {
      margin: 0 0 12px;
      font-size: 17px;
    }

    ul {
      margin: 0;
      padding-left: 20px;
    }

    li {
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>你好，我是DrLogicBox</h1>
    <p class="role">前端开发爱好者 / 持续学习者</p>
    <p>我热爱通过代码把想法变成真实可见的网页，也喜欢在实践中不断优化细节与体验。</p>
    <p>目前主要专注于：</p>
    <ul>
      <li>使用 HTML、CSS、JavaScript 构建简洁实用的页面</li>
      <li>学习现代前端工程化与组件化开发方式</li>
      <li>记录成长过程，分享技术与生活中的灵感</li>
    </ul>
  </main>
</body>
</html>
